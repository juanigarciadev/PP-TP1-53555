    <text x="795" y="651" font-size="12" fill="#222">titulo = "Taller de Robótica"</text>
    <text x="795" y="670" font-size="12" fill="#222">cupoMaximo = 15</text>
    <text x="795" y="689" font-size="12" fill="#222">requiereNotebook = true</text>
