  <path d="M260,445 C280,650 300,900 350,1075" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>

  <!-- Note about overlap -->
  <text x="875" y="1225" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Nota: "Juan López" está inscripto tanto en la Charla como en el Taller — por eso dos objetos Inscripcion distintos referencian al mismo objeto Estudiante en el heap.</text>
</svg>
