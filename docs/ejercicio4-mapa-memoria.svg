    <rect x="380" y="580" width="280" height="170" rx="6" fill="#DFF6E3" stroke="#2c8a44" stroke-width="2"/>
    <text x="520" y="603" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Charla : Actividad</text>
    <line x1="390" y1="612" x2="650" y2="612" stroke="#2c8a44" stroke-width="1"/>
    <text x="395" y="632" font-size="12" fill="#222">id = 1</text>
    <text x="395" y="651" font-size="12" fill="#222">titulo = "Introducción a IA"</text>
    <text x="395" y="670" font-size="12" fill="#222">cupoMaximo = 30</text>
    <text x="395" y="689" font-size="12" fill="#222">disertante = "Lic. Gómez"</text>
    <text x="395" y="708" font-size="12" fill="#222">inscripciones ────</text>
    <text x="395" y="726" font-size="11" fill="#777" font-style="italic">(List&lt;Inscripcion&gt;)</text>
