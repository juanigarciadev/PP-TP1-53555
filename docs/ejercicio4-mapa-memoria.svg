  <path d="M540,580 C560,555 620,540 660,528" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#triangleHollow)"/>
  <!-- ref actividades list -> charla -->
  <path d="M660,445 C600,480 550,520 520,580" fill="none" stroke="#333333" stroke-width="1.4"/>

  <!-- Taller -->
