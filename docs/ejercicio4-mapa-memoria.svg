  </g>

  <!-- inscripcion -> estudiante associations -->
  <path d="M415,980 C420,1005 440,1020 460,1040" fill="none" stroke="#8e44ad" stroke-width="1.6"/>
  <path d="M665,980 C700,1005 730,1020 755,1040" fill="none" stroke="#8e44ad" stroke-width="1.6"/>
  <path d="M915,980 C870,1005 810,1020 775,1040" fill="none" stroke="#8e44ad" stroke-width="1.6"/>
  <path d="M1165,980 C1150,1005 1110,1020 1075,1040" fill="none" stroke="#8e44ad" stroke-width="1.6"/>

  <!-- STACK -> HEAP references -->
  <path d="M260,165 C500,165 850,190 960,220" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
  <path d="M260,235 C350,260 450,245 520,225" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
  <path d="M260,305 C450,600 750,900 950,1080" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
