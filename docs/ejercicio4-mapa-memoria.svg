    <text x="520" y="828" text-anchor="middle" font-size="11" fill="#555">(inscripciones de Charla)</text>
  </g>
  <path d="M520,750 L520,790" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#diamondFilled)"/>

  <g id="taller-insc-list">
    <rect x="800" y="790" width="240" height="50" rx="6" fill="#F3F3F3" stroke="#555555" stroke-width="1.6" stroke-dasharray="3,2"/>
    <text x="920" y="811" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">ArrayList&lt;Inscripcion&gt;</text>
    <text x="920" y="828" text-anchor="middle" font-size="11" fill="#555">(inscripciones de Taller)</text>
  </g>
  <path d="M920,750 L920,790" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#diamondFilled)"/>

  <!-- Inscripcion objects -->
  <g id="insc-c1">
    <rect x="310" y="880" width="210" height="100" rx="6" fill="#FDEBD0" stroke="#B06A00" stroke-width="1.8"/>
    <text x="415" y="901" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Inscripcion</text>
    <line x1="320" y1="909" x2="510" y2="909" stroke="#B06A00" stroke-width="1"/>
    <text x="325" y="927" font-size="11.5" fill="#222">fecha = 2026-08-23</text>
    <text x="325" y="944" font-size="11.5" fill="#222">estado = "Confirmada"</text>
    <text x="325" y="961" font-size="11.5" fill="#222">estudiante ───────</text>
  </g>
  <g id="insc-c2">
    <rect x="560" y="880" width="210" height="100" rx="6" fill="#FDEBD0" stroke="#B06A00" stroke-width="1.8"/>
    <text x="665" y="901" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Inscripcion</text>
    <line x1="570" y1="909" x2="760" y2="909" stroke="#B06A00" stroke-width="1"/>
    <text x="575" y="927" font-size="11.5" fill="#222">fecha = 2026-08-23</text>
    <text x="575" y="944" font-size="11.5" fill="#222">estado = "Confirmada"</text>
    <text x="575" y="961" font-size="11.5" fill="#222">estudiante ───────</text>
  </g>
  <g id="insc-t1">
    <rect x="810" y="880" width="210" height="100" rx="6" fill="#FDEBD0" stroke="#B06A00" stroke-width="1.8"/>
    <text x="915" y="901" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Inscripcion</text>
    <line x1="820" y1="909" x2="1010" y2="909" stroke="#B06A00" stroke-width="1"/>
    <text x="825" y="927" font-size="11.5" fill="#222">fecha = 2026-08-23</text>
    <text x="825" y="944" font-size="11.5" fill="#222">estado = "Confirmada"</text>
    <text x="825" y="961" font-size="11.5" fill="#222">estudiante ───────</text>
  </g>
  <g id="insc-t2">
    <rect x="1060" y="880" width="210" height="100" rx="6" fill="#FDEBD0" stroke="#B06A00" stroke-width="1.8"/>
    <text x="1165" y="901" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Inscripcion</text>
    <line x1="1070" y1="909" x2="1260" y2="909" stroke="#B06A00" stroke-width="1"/>
    <text x="1075" y="927" font-size="11.5" fill="#222">fecha = 2026-08-23</text>
    <text x="1075" y="944" font-size="11.5" fill="#222">estado = "Confirmada"</text>
    <text x="1075" y="961" font-size="11.5" fill="#222">estudiante ───────</text>
  </g>

  <!-- list -> inscripcion refs -->
  <path d="M490,840 L415,880" fill="none" stroke="#333333" stroke-width="1.3"/>
  <path d="M550,840 L665,880" fill="none" stroke="#333333" stroke-width="1.3"/>
  <path d="M890,840 L915,880" fill="none" stroke="#333333" stroke-width="1.3"/>
  <path d="M950,840 L1165,880" fill="none" stroke="#333333" stroke-width="1.3"/>

  <!-- Estudiante objects -->
  <g id="est1">
    <rect x="350" y="1040" width="220" height="90" rx="6" fill="#E3E0FF" stroke="#4a2fa0" stroke-width="2"/>
    <text x="460" y="1063" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Estudiante</text>
    <line x1="360" y1="1071" x2="560" y2="1071" stroke="#4a2fa0" stroke-width="1"/>
    <text x="365" y="1090" font-size="12" fill="#222">legajo = "1001"</text>
    <text x="365" y="1108" font-size="12" fill="#222">nombre = "Ana Pérez"</text>
  </g>
  <g id="est2">
    <rect x="650" y="1040" width="220" height="90" rx="6" fill="#E3E0FF" stroke="#4a2fa0" stroke-width="2"/>
    <text x="760" y="1063" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Estudiante</text>
    <line x1="660" y1="1071" x2="860" y2="1071" stroke="#4a2fa0" stroke-width="1"/>
    <text x="665" y="1090" font-size="12" fill="#222">legajo = "1002"</text>
    <text x="665" y="1108" font-size="12" fill="#222">nombre = "Juan López"</text>
  </g>
  <g id="est3">
    <rect x="950" y="1040" width="220" height="90" rx="6" fill="#E3E0FF" stroke="#4a2fa0" stroke-width="2"/>
    <text x="1060" y="1063" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Estudiante</text>
    <line x1="960" y1="1071" x2="1160" y2="1071" stroke="#4a2fa0" stroke-width="1"/>
    <text x="965" y="1090" font-size="12" fill="#222">legajo = "1003"</text>
