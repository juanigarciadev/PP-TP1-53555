    <text x="710" y="516" text-anchor="middle" font-size="10.5" fill="#5a4080">id, titulo, cupoMaximo</text>
    <text x="710" y="529" text-anchor="middle" font-size="9.5" fill="#8a7ab0" font-style="italic">(no se instancia directamente)</text>
  </g>

  <!-- Charla -->
